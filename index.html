<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prize Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Bangers&family=Anton&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style id="app-style">
  :root{
    --bg1:#efe8fb; --bg2:#f8f1ff; --accent:#8f6fd8; --accentDark:#5f3fae;
    --gold:#f0cd7a; --sea:#79d0da; --ink:#3c3350;
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 50% 0%, #6fb8d6 0%, #2f7aa8 55%, #1f5c85 100%);
    font-family:'Nunito',sans-serif;
    color:#3c3350;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  h1,h2,h3,h4{font-family:'Fredoka',sans-serif;margin:0;font-weight:600;}
  button,input,select,textarea{font-family:'Nunito',sans-serif;}
  #app{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
  .rope-frame{
    border-radius:20px;padding:14px;position:relative;
    background:repeating-linear-gradient(45deg,#8a6a3f 0 6px,#6e5230 6px 12px);
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    margin-top:10px;
  }
  .hero-ship-deco{
    position:absolute;right:-22px;top:36px;width:92px;z-index:3;
    filter:drop-shadow(2px 4px 3px rgba(0,0,0,0.35));
  }
  @media(max-width:420px){.hero-ship-deco{width:70px;right:-14px;top:44px;}}
  .parchment{
    border-radius:14px;padding:18px 16px 26px;
    background:
      radial-gradient(circle at 15% 20%, rgba(150,110,60,0.10) 0 14%, transparent 60%),
      radial-gradient(circle at 85% 75%, rgba(150,110,60,0.10) 0 16%, transparent 60%),
      radial-gradient(circle at 70% 15%, rgba(150,110,60,0.08) 0 10%, transparent 55%),
      linear-gradient(150deg,#f3e6c8,#ecd9ae);
    box-shadow:inset 0 0 0 2px rgba(120,90,50,0.35), inset 0 0 40px rgba(120,90,50,0.15);
  }
  #confetti-canvas{
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    pointer-events:none;z-index:999;
  }
  a{color:inherit;}

  /* ---- shared bits ---- */
  .pillbtn{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;
    border:none;border-radius:999px;padding:12px 22px;cursor:pointer;
    color:#fff;background:var(--accent);
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
    transition:transform .08s ease;
  }
  .pillbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.12);}
  .pillbtn.ghost{
    background:#fff;color:var(--ink);border:2px solid #e4dcf5;box-shadow:none;
  }
  .pillbtn.small{padding:8px 16px;font-size:13.5px;}
  .pillbtn.negative{background:#fff;color:#8a7fa0;border:2px solid #e4dcf5;box-shadow:none;}
  .pillbtn:disabled{opacity:.4;cursor:default;}
  .backlink{
    display:inline-flex;align-items:center;gap:6px;font-weight:700;
    color:var(--accentDark);font-family:'Fredoka',sans-serif;font-size:14px;
    text-decoration:none;margin-bottom:14px;
  }

  /* ---- hub ---- */
  .hub-head{text-align:center;margin-bottom:22px;}
  .hub-head h1{font-size:28px;color:#5f3fae;}
  .hub-head p{margin:6px 0 0;color:#8a7fa0;font-size:14.5px;}
  .hub-grid{display:flex;flex-direction:column;gap:14px;}
  .hub-card{
    background:#fff;border-radius:20px;overflow:hidden;
    box-shadow:0 4px 16px rgba(90,60,140,0.08);
    display:flex;align-items:center;gap:14px;padding:14px 16px;
  }
  .hub-swatch{
    width:54px;height:54px;border-radius:16px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .hub-info{flex:1;min-width:0;}
  .hub-info h3{font-size:17px;}
  .hub-dots{display:flex;gap:5px;margin-top:6px;}
  .hub-dot{width:9px;height:9px;border-radius:50%;background:#e4dcf5;}
  .hub-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .add-card{
    background:#fff;border:2px dashed #d9cdf2;border-radius:20px;
    padding:18px;margin-top:6px;
  }
  .add-card h3{font-size:16px;margin-bottom:12px;}
  .field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field-row label{font-size:12.5px;font-weight:700;color:#8a7fa0;}
  .field-row input,.field-row select,.field-row textarea{
    border:1.5px solid #e4dcf5;border-radius:10px;padding:9px 11px;font-size:14.5px;background:#faf8ff;
  }

  /* ---- scroll banner ---- */
  .scroll-banner{
    position:relative;text-align:center;padding:20px 18px 16px;margin:2px 0 18px;
    background:#f6ecd2;
    border-top:4px solid #6e5230;border-bottom:4px solid #6e5230;
    box-shadow:0 3px 10px rgba(90,60,30,0.15);
  }
  .scroll-banner::before,.scroll-banner::after{
    content:"";position:absolute;top:-4px;bottom:-4px;width:16px;
    background:linear-gradient(90deg,#8a6a3f,#6e5230);
    border-radius:8px;
  }
  .scroll-banner::before{left:-8px;}
  .scroll-banner::after{right:-8px;}
  .signpost-stack{position:absolute;top:8px;left:10px;display:flex;flex-direction:column;gap:5px;z-index:2;}
  .signpost{
    background:#6e5230;color:#f3e6c8;font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:8.5px;letter-spacing:.4px;padding:3px 9px;border-radius:2px;
    box-shadow:0 2px 0 rgba(0,0,0,0.2);white-space:nowrap;
  }
  .signpost:nth-child(1){transform:rotate(-3deg);}
  .signpost:nth-child(2){transform:rotate(2deg);margin-left:6px;}
  .signpost:nth-child(3){transform:rotate(-2deg);}
  .quote-tag{
    position:absolute;top:6px;right:8px;max-width:118px;background:#fbf3de;
    border:1.5px solid #22203f;border-radius:2px;padding:7px 9px 8px;
    transform:rotate(3deg);box-shadow:0 3px 6px rgba(0,0,0,0.18);z-index:2;
    font-family:'Nunito',sans-serif;font-size:9.5px;font-style:italic;color:#4a4030;line-height:1.3;
  }
  .emblem-wrap{margin:0 auto 6px;width:56px;height:56px;position:relative;z-index:2;}
  .scroll-banner .banner-pill{
    display:inline-block;background:rgba(255,255,255,.6);color:var(--accentDark);
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;letter-spacing:.3px;
    padding:4px 12px;border-radius:20px;margin-bottom:8px;position:relative;z-index:2;
    border:1.5px solid rgba(34,32,63,0.2);
  }
  .scroll-banner h1{
    font-family:'Pirata One',serif;font-size:34px;line-height:1;letter-spacing:.5px;
    color:#22203f;position:relative;z-index:2;text-shadow:1px 1px 0 rgba(255,255,255,0.3);
  }
  .scroll-banner p{margin:8px 0 0;color:#5c5340;font-size:13px;position:relative;z-index:2;}

  /* ---- ribbon banner ---- */
  .ribbon-banner{
    position:relative;text-align:center;margin:26px auto 4px;max-width:88%;
  }
  .ribbon-banner .ribbon-body{
    background:#8a2d2d;color:#fbf0dc;font-family:'Pirata One',serif;font-size:20px;
    padding:8px 26px;position:relative;box-shadow:0 3px 6px rgba(0,0,0,0.2);
    border-top:1.5px solid rgba(255,255,255,0.25);border-bottom:1.5px solid rgba(0,0,0,0.25);
  }
  .ribbon-banner .ribbon-tail{
    position:absolute;top:0;width:16px;height:100%;background:#6e2020;
  }
  .ribbon-banner .ribbon-tail.left{left:-16px;clip-path:polygon(0 50%,100% 0,100% 100%);}
  .ribbon-banner .ribbon-tail.right{right:-16px;clip-path:polygon(100% 50%,0 0,0 100%);}
  .ribbon-banner p{margin:6px 0 0;font-size:12.5px;color:#5c5340;}

  /* ---- medallion buttons ---- */
  .medallion-btn{
    width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:12px;color:#fbf0dc;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.3), inset 0 -3px 6px rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.25);
  }
  .medallion-btn:active{transform:translateY(2px);}
  .medallion-btn.pos{background:radial-gradient(circle at 35% 30%,#c94b4b,#8a2d2d);}
  .medallion-btn.neg{
    background:radial-gradient(circle at 35% 30%,#9a958f,#6b6660);color:#f3ede0;font-size:11px;
  }
  .xp-medallion-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}

  /* ---- map path decoration ---- */
  .map-path-deco{display:flex;justify-content:center;margin:10px 0 2px;opacity:0.8;}

  /* ==================== HERO ACADEMY MOTIF ==================== */
  .hero-frame{
    border-radius:16px;padding:3px;margin-top:10px;
    background:linear-gradient(135deg,#16213e,#c62828);
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .hero-panel{
    border-radius:13px;padding:16px 14px 22px;
    background:
      radial-gradient(circle, rgba(22,33,62,0.14) 1.6px, transparent 1.6px) 0 0/16px 16px,
      #f4f6fb;
  }
  .comic-banner{
    position:relative;border-radius:12px;padding:22px 18px 18px;text-align:center;overflow:hidden;
    background:#16213e;border:3px solid #16213e;margin-bottom:16px;
  }
  .comic-banner::before{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(115deg, transparent 0 38%, rgba(255,203,61,0.9) 38% 46%, transparent 46% 100%),
      linear-gradient(115deg, transparent 0 55%, rgba(198,40,40,0.85) 55% 63%, transparent 63% 100%);
  }
  .comic-banner::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle, rgba(255,255,255,0.5) 1.4px, transparent 1.4px) 0 0/14px 14px;
    opacity:0.25;
  }
  .comic-shout{
    position:absolute;top:10px;right:10px;background:#c62828;color:#fff;
    font-family:'Bangers',cursive;font-size:15px;letter-spacing:.5px;line-height:1;
    padding:7px 10px 5px;border:2.5px solid #16213e;border-radius:4px;
    transform:rotate(6deg);z-index:3;box-shadow:2px 3px 0 rgba(0,0,0,0.3);
  }
  .comic-emblem-wrap{margin:0 auto 8px;width:64px;height:70px;position:relative;z-index:2;filter:drop-shadow(1px 2px 2px rgba(0,0,0,0.4));}
  .comic-banner .banner-pill{
    display:inline-block;background:#ffcb3d;color:#16213e;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:11px;letter-spacing:.4px;
    padding:4px 12px;border-radius:3px;margin-bottom:8px;position:relative;z-index:2;
    border:1.5px solid #16213e;
  }
  .comic-banner h1{
    font-family:'Bangers',cursive;font-size:32px;letter-spacing:1px;line-height:1;
    color:#ffcb3d;-webkit-text-stroke:1.5px #16213e;position:relative;z-index:2;
    text-shadow:2px 2px 0 #c62828;
  }
  .comic-banner p{margin:9px 0 0;color:#eef1f7;font-size:12.5px;position:relative;z-index:2;font-weight:600;}

  .comic-btn{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;color:#16213e;
    background:linear-gradient(180deg,#ffe08a,#ffcb3d);
    border:2.5px solid #16213e;border-radius:9px;padding:10px 16px;cursor:pointer;
    box-shadow:0 3px 0 #16213e;
  }
  .comic-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #16213e;}
  .comic-btn.neg{background:linear-gradient(180deg,#e7e9ee,#c9ccd6);}
  .comic-btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}

  .ribbon-banner.hero .ribbon-body{background:#16213e;}
  .ribbon-banner.hero .ribbon-tail{background:#0d1428;}

  .motif-hero .space-text{
    background:#fff;border:3px solid #16213e;clip-path:none;border-radius:8px;
    box-shadow:3px 3px 0 rgba(22,33,62,0.2);
  }
  .motif-hero .space-text::before,.motif-hero .space-text::after{display:none;}
  .motif-hero .earned-stamp{border-color:#c62828;color:#c62828;}
  .motif-hero .prize-thumb-large{border-color:#16213e;}
  .motif-hero .status-chip{border-color:#16213e;}
  .hero-badge-num{position:absolute;top:-24px;left:50%;transform:translateX(-50%);}

  /* ---- xp card ---- */
  .xp-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 4px 16px rgba(90,60,140,0.07);}
  .xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;flex-wrap:wrap;gap:4px;}
  .xp-top h3{font-size:16px;color:var(--ink);}
  .xp-top .date{font-size:12.5px;color:#a79bbb;}
  .bar-track{height:22px;background:#f0eaf9;border-radius:12px;overflow:hidden;margin-bottom:5px;}
  .bar-fill{height:100%;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accentDark));transition:width .4s ease;}
  .bar-ticks{display:flex;justify-content:space-between;font-size:11px;color:#b6acc7;margin-bottom:4px;}
  .bar-count{text-align:right;font-size:13px;color:var(--accentDark);font-weight:800;margin-bottom:14px;}
  .xp-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .status-line{font-size:13.5px;color:#8a7fa0;margin-top:4px;}
  .unlock-cta{
    width:100%;margin-top:14px;padding:16px;border-radius:16px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#f6b955);
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:17px;color:#5a3b12;
    box-shadow:0 5px 0 rgba(0,0,0,0.12);
  }
  .unlock-cta:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,0.12);}

  /* ---- board path ---- */
  .compass-corner{position:absolute;bottom:6px;left:8px;opacity:.85;z-index:2;}
  .path-wrap{position:relative;margin-top:20px;}
  .space-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;position:relative;}
  .space-row.right{flex-direction:row-reverse;}
  .space-icon-wrap{position:relative;flex-shrink:0;width:76px;height:76px;}
  .token{position:absolute;top:-24px;left:50%;transform:translateX(-50%);filter:drop-shadow(1px 3px 2px rgba(0,0,0,0.35));}
  .space-text{
    flex:1;position:relative;background:#f6ecd2;padding:16px 14px 12px;
    border:3px solid #22203f;
    clip-path:polygon(0% 4%,3% 0%,97% 0%,100% 5%,100% 95%,97% 100%,3% 100%,0% 96%);
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
    overflow:hidden;
  }
  .space-text::before,.space-text::after{
    content:"";position:absolute;top:6px;width:9px;height:9px;border-radius:50%;
    background:var(--gold,#e0a83c);box-shadow:inset 0 0 0 2px #22203f;
  }
  .space-text::before{left:9px;}
  .space-text::after{right:9px;}
  .space-row.right .space-text::before{left:9px;}
  .ribbon-tag{
    display:inline-block;background:var(--accent,#33366f);color:#fff;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.6px;
    padding:2px 9px 2px;border-radius:3px;margin-bottom:6px;text-transform:uppercase;
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .space-text-inner{display:flex;gap:10px;align-items:flex-start;text-align:left;}
  .prize-thumb-large{
    width:64px;height:64px;margin:6px auto 8px;border-radius:8px;
    background:#fbf6e8;border:2px solid #22203f;padding:5px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    text-decoration:none;
  }
  .shelf-slot-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-decoration:none;}
  .space-text-body{flex:1;min-width:0;}
  .space-text{text-align:center;}
  .space-text h4{font-size:14.5px;margin-bottom:2px;color:#22203f;}
  .space-text p{font-size:12px;color:#6b6350;margin:0 0 6px;}
  .status-chip{
    display:inline-block;font-size:10px;font-weight:800;font-family:'Fredoka',sans-serif;
    padding:3px 10px;border-radius:4px;background:#e4dcc2;color:#7a7260;letter-spacing:.2px;
    border:1.5px solid #22203f;
  }
  .status-chip.current{background:var(--gold,#e0a83c);color:#22203f;}
  .status-chip.earned{background:#22203f;color:var(--gold,#e0a83c);}
  .earned-stamp{
    position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
    border:3px solid #a53232;color:#a53232;font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:15px;letter-spacing:1px;padding:3px 12px;border-radius:6px;opacity:0.8;
    text-transform:uppercase;pointer-events:none;background:rgba(255,255,255,0.15);
  }
  .space-row.locked .space-icon-wrap svg{filter:grayscale(1) opacity(0.6);}
  .space-row.locked .space-text{background:#e4dcc2;}
  .space-row.locked .space-text .ribbon-tag{background:#8a8470;}

  /* ---- shelf ---- */
  .shelf-row{
    display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
    background:#fff;border-radius:18px;padding:16px;margin-top:14px;
    box-shadow:0 4px 16px rgba(90,60,140,0.07);
  }
  @media(max-width:480px){.shelf-row{grid-template-columns:repeat(3,1fr);}}
  .shelf-slot{
    aspect-ratio:1;border-radius:6px;border:2.5px solid #22203f;
    display:flex;align-items:center;justify-content:center;background:#f6ecd2;overflow:hidden;
    box-shadow:0 3px 0 rgba(0,0,0,0.1);
  }
  .shelf-slot.locked{background:#e4dcc2;}
  .shelf-slot.locked svg{filter:grayscale(1) opacity(0.45);}

  /* ---- admin ---- */
  details.admin{margin-top:30px;background:#fff;border-radius:18px;padding:4px 18px;box-shadow:0 4px 16px rgba(90,60,140,0.07);}
  details.admin summary{
    cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px;
    color:var(--accentDark);padding:14px 0;list-style:none;
  }
  details.admin summary::-webkit-details-marker{display:none;}
  .admin-body{padding:6px 0 18px;border-top:1.5px solid #f0eaf9;}
  .admin-section{margin-top:16px;}
  .admin-section h4{font-size:13px;color:#8a7fa0;margin-bottom:8px;}
  .admin-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;}
  .admin-row input,.admin-row select{border:1.5px solid #e4dcf5;border-radius:10px;padding:8px 10px;font-size:14px;background:#faf8ff;}
  .prize-edit-row{display:grid;grid-template-columns:1.2fr 1.2fr 1fr auto;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px solid #f0eaf9;}
  @media(max-width:480px){.prize-edit-row{grid-template-columns:1fr;}}
  .prize-edit-row input,.prize-edit-row select{border:1.5px solid #e4dcf5;border-radius:10px;padding:8px 10px;font-size:13.5px;background:#faf8ff;}
  .upload-btn{
    font-size:12.5px;font-weight:700;color:#8a7fa0;
    border:1.5px dashed #d9cdf2;padding:7px 11px;border-radius:9px;background:#faf8ff;
  }
  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    background:#3c3350;color:#fff;padding:11px 20px;border-radius:14px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);z-index:1000;opacity:0;
    transition:opacity .25s ease, top .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;top:24px;}
  .empty-note{text-align:center;color:#a79bbb;font-size:13px;padding:20px;}
</style>
</head>

/* Renders whatever visual a prize should show — an uploaded photo if one
   exists, otherwise the built-in icon — and wraps it in a link if the
   prize has one, so tapping the image opens that page. */
function renderPrizeVisual(prize, wrapClass, c, faded){
  var inner = prize.customImage
    ? '<img src="' + prize.customImage + '" alt="" style="width:100%;height:100%;object-fit:cover;' + (faded ? "filter:grayscale(1) opacity(0.45);" : "") + '">'
    : renderIcon(prize.icon || "mystery", c, faded);
  var openTag = prize.link
    ? '<a class="' + wrapClass + '" href="' + escapeHtml(prize.link) + '" target="_blank" rel="noopener noreferrer" title="Open link">'
    : '<div class="' + wrapClass + '">';
  var closeTag = prize.link ? '</a>' : '</div>';
  return openTag + inner + closeTag;
}

  var seedData = JSON.parse(document.getElementById("app-data").textContent);

var TEACHER_USER = null; // set once Firebase Auth reports a signed-in teacher

/* ============ helpers ============ */
function todayStr(){
  var d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function formatDateLong(dstr){
  if(!dstr) return "";
  var p = dstr.split("-").map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  return dt.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
}
function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
  });
}
function slugify(s){
  var base = String(s).toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,16) || "student";
  var existing = STATE.students.map(function(x){ return x.id; });
  if(existing.indexOf(base) === -1) return base;
  var n = 2;
  while(existing.indexOf(base+n) !== -1){ n++; }
  return base+n;
}
function randomCode(){
  return String(Math.floor(1000 + Math.random()*9000)); // 4-digit
}
function findStudent(id){
  for(var i=0;i<STATE.students.length;i++){ if(STATE.students[i].id === id) return STATE.students[i]; }
  return null;
}
function ensureFreshDay(s){
  var t = todayStr();
  if(s.todayDate !== t){ s.todayDate = t; s.todayXP = 0; }
}
function getQueryStudent(){
  var m = window.location.search.match(/(?:^\?|&)student=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function getQueryCode(){
  var m = window.location.search.match(/(?:^\?|&)code=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function isUnlocked(id){
  return localStorage.getItem("pq_unlocked_" + id) === "1";
}
function markUnlocked(id){
  try { localStorage.setItem("pq_unlocked_" + id, "1"); } catch(e){}
}
function boardLink(s){
  return window.location.origin + window.location.pathname + "?student=" + encodeURIComponent(s.id) +
    (s.code ? "&code=" + encodeURIComponent(s.code) : "");
}

/* ============ persistence (Firebase Firestore + Auth) ============ */
var seeded = false;
var pendingTimers = {};
var singleUnsub = null, collectionUnsub = null;

function writeStudent(s){
  if(!firestore){ showToast("Not connected — check firebaseConfig"); return Promise.resolve(); }
  return firestore.collection("students").doc(s.id).set(s).catch(function(err){
    console.error(err);
    showToast("Couldn't save — check your connection");
  });
}
function scheduleWriteStudent(s){
  clearTimeout(pendingTimers[s.id]);
  pendingTimers[s.id] = setTimeout(function(){ writeStudent(s); }, 650);
}
function deleteStudentDoc(id){
  if(!firestore) return Promise.resolve();
  return firestore.collection("students").doc(id).delete();
}

/* Board view: subscribe to exactly ONE document (a "get", not a "list" —
   allowed by the rules for anyone with the link, no teacher login needed). */
function subscribeSingleStudent(id){
  if(!firestore){ render(); return; }
  if(singleUnsub) singleUnsub();
  singleUnsub = firestore.collection("students").doc(id).onSnapshot(function(snap){
    if(snap.exists){
      var data = snap.data(); data.id = snap.id;
      STATE.students = [data];
    } else {
      STATE.students = [];
    }
    render();
  }, function(err){
    console.error(err);
    showToast("Connection issue — changes may not sync");
  });
}

/* Hub view: subscribes to the WHOLE collection — this is a Firestore "list",
   which the rules only grant to a signed-in teacher. */
function subscribeAllStudents(){
  if(!firestore){ render(); return; }
  if(collectionUnsub) collectionUnsub();
  collectionUnsub = firestore.collection("students").onSnapshot(function(snapshot){
    if(snapshot.empty && !seeded && SEED_STUDENTS.length){
      seeded = true;
      SEED_STUDENTS.forEach(function(st){ writeStudent(st); });
      return; // the write triggers another snapshot with real data
    }
    STATE.students = snapshot.docs.map(function(d){
      var data = d.data(); data.id = d.id; return data;
    });
    render();
  }, function(err){
    console.error(err);
    showToast("Sign in to view all students");
  });
}

var ALLOWED_TEACHER_EMAILS = ["ariana.flatt@unbound.school"];

function teacherSignInWithGoogle(){
  if(!auth){ showToast("Not connected — check firebaseConfig"); return; }
  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(function(result){
    var email = result.user && result.user.email;
    if(ALLOWED_TEACHER_EMAILS.indexOf(email) === -1){
      auth.signOut();
      showToast("That Google account isn't set up as a teacher for this board.");
    }
  }).catch(function(err){
    if(err && err.code !== "auth/popup-closed-by-user"){
      showToast("Sign-in failed: " + (err.message || "please try again"));
    }
  });
}
function teacherSignOut(){
  if(auth) auth.signOut();
}
function isAllowedTeacher(user){
  return !!user && ALLOWED_TEACHER_EMAILS.indexOf(user.email) !== -1;
}

/* ============ toast ============ */
function showToast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
}

/* ============ confetti ============ */
function fireConfetti(colors){
  var canvas = document.getElementById("confetti-canvas");
  var dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  var W = window.innerWidth, H = window.innerHeight;
  var parts = [];
  for(var i=0;i<130;i++){
    parts.push({
      x: Math.random()*W, y: -20 - Math.random()*H*0.3,
      vx: (Math.random()-0.5)*4, vy: 2+Math.random()*3.5,
      size: 5+Math.random()*6, rot: Math.random()*360,
      vrot: (Math.random()-0.5)*10,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 0
    });
  }
  var start = Date.now();
  function tick(){
    var elapsed = Date.now() - start;
    ctx.clearRect(0,0,W,H);
    parts.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    });
    if(elapsed < 2600){ requestAnimationFrame(tick); }
    else { ctx.clearRect(0,0,W,H); }
  }
  tick();
}

/* ============ render dispatch ============ */
function render(){
  var app = document.getElementById("app");
  var sid = getQueryStudent();
  if(sid){
    var student = findStudent(sid);
    if(student){
      var urlCode = getQueryCode();
      var matchesUrlCode = !!(student.code && urlCode && urlCode === student.code);
      var unlocked = !!TEACHER_USER || isUnlocked(sid) || matchesUrlCode;
      if(unlocked){
        if(matchesUrlCode) markUnlocked(sid);
        ensureFreshDay(student);
        app.innerHTML = renderBoard(student);
      } else {
        app.innerHTML = renderCodeGate(student);
      }
    } else {
      app.innerHTML = '<div class="empty-note">That quest link doesn\'t match anyone yet. <a class="backlink" href="' + escapeHtml(window.location.pathname) + '" style="display:inline;">← Go to the quest hub</a></div>';
    }
  } else {
    app.innerHTML = TEACHER_USER ? renderHub() : renderTeacherLogin();
  }
  attachHandlers();
}

  });

/* Resizes/compresses an uploaded image client-side so it's small enough
   to sit as a base64 string inside a Firestore document (1 MiB/doc limit). */
function resizeImageFile(file, maxDim, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = function(){ showToast("Couldn't read that image"); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ showToast("Couldn't read that image"); };
  reader.readAsDataURL(file);
}

function onPrizePhotoChange(e){
  var el = e.currentTarget;
  var idx = parseInt(el.getAttribute("data-prize-photo"), 10);
  var file = el.files && el.files[0];
  if(!file) return;
  var sid = getQueryStudent();
  var s = sid ? findStudent(sid) : null;
  if(!s || !TEACHER_USER){ showToast("Sign in as the teacher to upload photos"); return; }
  showToast("Uploading photo…");
  resizeImageFile(file, 220, 0.7, function(dataUrl){
    if(s.prizes[idx]){
      s.prizes[idx].customImage = dataUrl;
      render();
      writeStudent(s).then(function(){ showToast("Photo saved"); });
    }
  });
}

function onAction(e){
  var el = e.currentTarget;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  var s = id ? findStudent(id) : null;

  if(action === "unlock-code"){
    var entered = document.getElementById("gate-code").value.trim();
    if(s && s.code && entered === s.code){
      markUnlocked(id);
      render();
    } else {
      showToast("That code doesn't match");
    }
  }
  else if(action === "teacher-signin"){
    teacherSignInWithGoogle();
  }
  else if(action === "teacher-signout"){
    teacherSignOut();
  }
  else if(action === "open"){
    window.location.href = "?student=" + encodeURIComponent(id);
  }
  else if(action === "copy-link"){
    var link = boardLink(s);
    if(navigator.clipboard){ navigator.clipboard.writeText(link).then(function(){ showToast("Link copied!"); }); }
    else { showToast(link); }
  }
  else if(action === "delete-student"){
    if(s && confirm('Delete "' + s.name + '"\'s quest? This can\'t be undone.')){
      STATE.students = STATE.students.filter(function(x){ return x.id !== id; });
      render();
      deleteStudentDoc(id);
    }
  }
  else if(action === "add-student"){
    var name = document.getElementById("new-name").value.trim();
    if(!name){ showToast("Give the quest a name first"); return; }
    var pronouns = document.getElementById("new-pronouns").value;
    var motif = document.getElementById("new-motif").value;
    var palette = document.getElementById("new-palette").value;
    var goal = parseInt(document.getElementById("new-goal").value, 10) || 120;
    var code = document.getElementById("new-code").value.trim() || randomCode();
    var newId = slugify(name);
    var newStudent = {
      id: newId, name: name, pronouns: pronouns, palette: palette, motif: motif, code: code,
      dailyGoal: goal, todayDate: todayStr(), todayXP: 0, position: 0,
      wonDates: [null,null,null,null,null],
      prizes: [0,1,2,3,4].map(function(){ return {title:"", desc:"", icon:"mystery"}; })
    };
    writeStudent(newStudent).then(function(){ window.location.href = "?student=" + encodeURIComponent(newId); });
  }
  else if(action === "xp"){
    if(!s || !TEACHER_USER) return;
    ensureFreshDay(s);
    var amt = parseInt(el.getAttribute("data-amt"), 10);
    s.todayXP = Math.max(0, s.todayXP + amt);
    render();
    scheduleWriteStudent(s);
  }
  else if(action === "unlock"){
    if(!s || !TEACHER_USER) return;
    if(s.position < 5 && s.todayXP >= (s.dailyGoal||120)){
      s.wonDates[s.position] = todayStr();
      s.position += 1;
      var p = PALETTES[s.palette] || PALETTES.lavender;
      fireConfetti([p.accent, p.accentDark, p.gold, p.sea, "#ffffff"]);
      render();
      writeStudent(s);
    }
  }
  else if(action === "log-full-day"){
    if(!s) return;
    ensureFreshDay(s);
    s.todayXP = s.dailyGoal || 120;
    render();
    writeStudent(s);
  }
  else if(action === "reset-board"){
    if(!s) return;
    if(confirm('Reset the whole board for ' + s.name + '? Progress and won spaces will be cleared.')){
      s.position = 0;
      s.wonDates = [null,null,null,null,null];
      s.todayXP = 0;
      s.todayDate = todayStr();
      render();
      writeStudent(s);
    }
  }
  else if(action === "clear-prizes"){
    if(!s) return;
    if(confirm('Clear all 5 prizes for ' + s.name + '? Titles, descriptions, photos, and links will all be removed — good for starting a new week.')){
      s.prizes = [0,1,2,3,4].map(function(){ return {title:"", desc:"", icon:"mystery"}; });
      render();
      writeStudent(s);
      showToast("Prizes cleared — ready for new ones");
    }
  }
  else if(action === "save-name"){
    if(!s) return;
    var v = document.getElementById("admin-name").value.trim();
    if(v){ s.name = v; render(); writeStudent(s); showToast("Name updated"); }
  }
  else if(action === "save-goal"){
    if(!s) return;
    var g = parseInt(document.getElementById("admin-goal").value, 10);
    if(g > 0){ s.dailyGoal = g; render(); writeStudent(s); showToast("Daily goal updated"); }
  }
  else if(action === "save-palette"){
    if(!s) return;
    s.palette = document.getElementById("admin-palette").value;
    render(); writeStudent(s); showToast("Palette updated");
  }
  else if(action === "save-motif"){
    if(!s) return;
    s.motif = document.getElementById("admin-motif").value;
    render(); writeStudent(s); showToast("Design style updated");
  }
  else if(action === "save-code"){
    if(!s) return;
    var newCode = document.getElementById("admin-code").value.trim();
    if(!newCode){ showToast("Code can't be empty"); return; }
    s.code = newCode;
    render(); writeStudent(s); showToast("Access code updated");
  }
  else if(action === "save-prizes"){
    if(!s) return;
    var rows = document.querySelectorAll('[data-prize-idx]');
    rows.forEach(function(input){
      var idx = parseInt(input.getAttribute("data-prize-idx"), 10);
      var field = input.getAttribute("data-prize-field");
      if(s.prizes[idx]) s.prizes[idx][field] = input.value;
    });
    render(); writeStudent(s); showToast("Prizes updated");
  }
  else if(action === "remove-prize-photo"){
    if(!s) return;
    var pidx = parseInt(el.getAttribute("data-idx"), 10);
    if(s.prizes[pidx]){
      delete s.prizes[pidx].customImage;
      render(); writeStudent(s); showToast("Photo removed — back to the built-in icon");
    }
  }
}

render();
var initialSid = getQueryStudent();
if(initialSid){
  subscribeSingleStudent(initialSid);
} else if(!auth){
  subscribeAllStudents();
}
if(auth){
  auth.onAuthStateChanged(function(user){
    if(user && !isAllowedTeacher(user)){
      auth.signOut();
      TEACHER_USER = null;
      showToast("That Google account isn't set up as a teacher for this board.");
      return;
    }
    TEACHER_USER = user;
    if(!getQueryStudent()){
      if(user){ subscribeAllStudents(); }
      else { if(collectionUnsub){ collectionUnsub(); collectionUnsub = null; } STATE.students = []; render(); }
    } else {
      render(); // teacher sign-in state can bypass the code gate on a student link too
    }
  });
}
window.addEventListener("popstate", render);
})();
</script>
</body>
</html>
